<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26930" />
      <stop offset="100%" stop-color="#C8380D" />
    </linearGradient>
    <linearGradient id="display" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142018" />
      <stop offset="100%" stop-color="#0B130E" />
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Corpo da bomba de combustível -->
  <rect x="14" y="16" width="22" height="34" rx="4" fill="#FFFFFF" />

  <!-- Display / Visor digital -->
  <rect x="18" y="21" width="14" height="10" rx="2" fill="url(#display)" />
  <!-- Indicador digital verde dentro do visor -->
  <rect x="20" y="24.5" width="10" height="3" rx="1" fill="#2ECC71" />

  <!-- Base da bomba -->
  <rect x="12" y="47" width="26" height="4" rx="2" fill="#E2DDD5" />

  <!-- Mangueira de combustível -->
  <path d="M36 26 C45 26, 48 34, 48 42 C48 46, 45 48, 42 48 C39 48, 38 45, 38 42 L38 27" 
        fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bico de abastecimento / Gatilho -->
  <path d="M43 17 L47 21 L43 25 L40 22 Z" fill="#FFFFFF" />
  <path d="M46 20 L51 15 L50 14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
</svg>